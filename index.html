<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Sugarfall — Match 3 Candy Puzzle</title>
<meta name="description" content="A sweet match-3 puzzle. Swap candies, build combos, clear the board. Plays great on phones and desktop.">
<meta name="theme-color" content="#3a1a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff4d5e"/>
      <stop offset="22%"  stop-color="#ff9b21"/>
      <stop offset="44%"  stop-color="#ffdd33"/>
      <stop offset="64%"  stop-color="#4fd44f"/>
      <stop offset="82%"  stop-color="#37b6ff"/>
      <stop offset="100%" stop-color="#b95cff"/>
    </linearGradient>
  </defs>

  <!-- 0 gumball -->
  <symbol id="p0" viewBox="0 0 100 100">
    <circle cx="50" cy="52" r="42" fill="var(--pd)"/>
    <circle cx="50" cy="49" r="37" fill="var(--pc)"/>
    <path d="M50 12a37 37 0 0 1 35 25A37 37 0 0 0 15 37 37 37 0 0 1 50 12z" fill="var(--pl)" opacity=".55"/>
    <ellipse cx="37" cy="31" rx="15" ry="10" fill="#fff" opacity=".65" transform="rotate(-28 37 31)"/>
    <circle cx="66" cy="68" r="6" fill="#fff" opacity=".22"/>
  </symbol>

  <!-- 1 wrapped taffy -->
  <symbol id="p1" viewBox="0 0 100 100">
    <path d="M12 30 28 44v14L12 72c-3 2-6 0-5-3l5-16-5-18c-1-4 2-6 5-5z" fill="var(--pd)"/>
    <path d="M88 30 72 44v14l16 14c3 2 6 0 5-3l-5-16 5-18c1-4-2-6-5-5z" fill="var(--pd)"/>
    <rect x="22" y="24" width="56" height="54" rx="18" fill="var(--pd)"/>
    <rect x="26" y="27" width="48" height="46" rx="15" fill="var(--pc)"/>
    <rect x="31" y="32" width="38" height="12" rx="6" fill="#fff" opacity=".5"/>
    <circle cx="62" cy="62" r="5" fill="#fff" opacity=".25"/>
  </symbol>

  <!-- 2 star drop -->
  <symbol id="p2" viewBox="0 0 100 100">
    <path d="M50 8 63 36l31 4-23 21 6 31-27-15-27 15 6-31-23-21 31-4z" fill="var(--pd)"/>
    <path d="M50 16 61 40l26 3-19 18 5 26-23-13-23 13 5-26-19-18 26-3z" fill="var(--pc)"/>
    <path d="M50 22 58 41l21 2-15 14 4 21-18-10-18 10 4-21-15-14 21-2z" fill="var(--pl)" opacity=".45"/>
    <ellipse cx="41" cy="34" rx="9" ry="5" fill="#fff" opacity=".7" transform="rotate(-30 41 34)"/>
  </symbol>

  <!-- 3 gummy triangle -->
  <symbol id="p3" viewBox="0 0 100 100">
    <path d="M50 12c5 0 9 3 11 7l29 50c4 7-1 15-9 15H19c-8 0-13-8-9-15l29-50c2-4 6-7 11-7z" fill="var(--pd)"/>
    <path d="M50 20c3 0 6 2 7 5l26 45c3 5-1 10-6 10H23c-5 0-9-5-6-10l26-45c1-3 4-5 7-5z" fill="var(--pc)"/>
    <path d="M50 30 68 62H32z" fill="var(--pl)" opacity=".45"/>
    <ellipse cx="44" cy="40" rx="8" ry="5" fill="#fff" opacity=".6" transform="rotate(-32 44 40)"/>
  </symbol>

  <!-- 4 peppermint pinwheel -->
  <symbol id="p4" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="41" fill="var(--pd)"/>
    <circle cx="50" cy="50" r="36" fill="var(--pc)"/>
    <g fill="#fff" opacity=".92">
      <path d="M50 50 50 14A36 36 0 0 1 70.6 20.5Z"/>
      <path d="M50 50 50 14A36 36 0 0 1 70.6 20.5Z" transform="rotate(72 50 50)"/>
      <path d="M50 50 50 14A36 36 0 0 1 70.6 20.5Z" transform="rotate(144 50 50)"/>
      <path d="M50 50 50 14A36 36 0 0 1 70.6 20.5Z" transform="rotate(216 50 50)"/>
      <path d="M50 50 50 14A36 36 0 0 1 70.6 20.5Z" transform="rotate(288 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="9" fill="var(--pl)"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="var(--pd)" stroke-width="3" opacity=".45"/>
    <ellipse cx="36" cy="29" rx="12" ry="7" fill="#fff" opacity=".5" transform="rotate(-30 36 29)"/>
  </symbol>

  <!-- 5 gem -->
  <symbol id="p5" viewBox="0 0 100 100">
    <path d="M50 8 88 32v36L50 92 12 68V32z" fill="var(--pd)"/>
    <path d="M50 16 81 36v28L50 84 19 64V36z" fill="var(--pc)"/>
    <path d="M50 16 81 36 50 50 19 36z" fill="var(--pl)" opacity=".6"/>
    <path d="M50 50v34L19 64V36z" fill="#000" opacity=".12"/>
    <ellipse cx="41" cy="30" rx="10" ry="5" fill="#fff" opacity=".65" transform="rotate(-20 41 30)"/>
  </symbol>

  <!-- rainbow drop -->
  <symbol id="pstar" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="43" fill="#2b1340"/>
    <circle cx="50" cy="50" r="39" fill="url(#rainbow)"/>
    <path d="M50 18l9.5 20.5L82 41l-16.5 15.5L70 79 50 68 30 79l4.5-22.5L18 41l22.5-2.5z"
          fill="#fff" opacity=".95"/>
    <ellipse cx="36" cy="28" rx="12" ry="7" fill="#fff" opacity=".5" transform="rotate(-30 36 28)"/>
  </symbol>

  <symbol id="icecrack" viewBox="0 0 100 100">
    <path d="M50 4v30M50 66v30M4 50h30M66 50h30M22 22l18 18M78 22L60 40M22 78l18-18M78 78L60 60"
          stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9" fill="none"/>
  </symbol>
</svg>

<div class="backdrop" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span>
  <span class="blob b3"></span><span class="blob b4"></span>
</div>

<div id="app">

  <!-- ==================================================== level select -->
  <section id="home" class="screen is-active">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" style="--pc:#ff4d5e;--pd:#c11d35;--pl:#ff9aa5"><use href="#p0"/></svg>
        <svg viewBox="0 0 100 100" style="--pc:#ffdd33;--pd:#d9a800;--pl:#fff09a"><use href="#p2"/></svg>
        <svg viewBox="0 0 100 100" style="--pc:#37b6ff;--pd:#0b73c4;--pl:#9adcff"><use href="#p4"/></svg>
      </div>
      <h1>Sugarfall</h1>
      <p class="tagline">Match 3 · Build combos · Clear the board</p>
    </header>

    <div class="panel">
      <div class="panel-head">
        <h2>Levels</h2>
        <p class="stars-total"><span id="totalStars">0</span><span class="slash">/</span><span id="maxStars">36</span> ★</p>
      </div>
      <div id="levelGrid" class="level-grid"></div>
    </div>

    <nav class="home-actions">
      <button id="btnHow" class="btn blue" type="button">How to play</button>
      <button id="btnSound" class="btn blue" type="button" aria-pressed="true">♪ Sound on</button>
      <button id="btnReset" class="btn flat" type="button">Reset</button>
    </nav>
    <p class="credit">An original game — no assets, names or code from any existing title.</p>
  </section>

  <!-- ============================================================ game -->
  <section id="game" class="screen">
    <div class="topbar">
      <button id="btnBack" class="icon-btn" type="button" aria-label="Back to level select">←</button>
      <div class="stage-title">
        <span class="no">Level <b id="stageNo">1</b></span>
        <span class="nm" id="stageName"></span>
      </div>
      <button id="btnRestart" class="icon-btn" type="button" aria-label="Restart this level">⟳</button>
    </div>

    <div class="hud">
      <div class="hud-box moves">
        <span class="label">Moves</span>
        <strong id="movesLeft">0</strong>
      </div>
      <div class="hud-box score">
        <span class="label">Score</span>
        <strong id="score">0</strong>
      </div>
    </div>

    <div id="goalList" class="goals" aria-label="Level goals"></div>

    <div class="board-wrap">
      <div id="board" class="board" role="application" aria-label="Candy board">
        <div class="layer cells" id="layerCells"></div>
        <div class="layer tiles" id="layerTiles"></div>
        <div class="layer fx" id="layerFx"></div>
      </div>
      <div id="combo" class="combo" aria-hidden="true"></div>
    </div>

    <div class="bottombar">
      <button id="btnHint" class="btn small" type="button">Hint</button>
      <p id="stageHint" class="tip"></p>
    </div>
  </section>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div id="dlgActions" class="dialog-actions"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
